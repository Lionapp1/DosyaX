name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Recreate Android platform (Flutter template AGP)
        run: |
          rm -rf android
          flutter create . --project-name dosyax --org com.dosyax --platforms=android

      - name: Patch AndroidManifest storage permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          perms = """
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
"""
          if "MANAGE_EXTERNAL_STORAGE" not in t:
              t = t.replace("<manifest", "<manifest", 1)
              t = t.replace(
                  ">\n",
                  ">\n" + perms,
                  1,
              )
          if "requestLegacyExternalStorage" not in t:
              t = t.replace(
                  "<application",
                  '<application android:requestLegacyExternalStorage="true"',
                  1,
              )
          p.write_text(t)
          print("Manifest patched")
          PY

      - name: Fix generated widget_test
        run: |
          cat > test/widget_test.dart << 'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:dosyax/main.dart';

          void main() {
            testWidgets('DosyaX smoke test', (WidgetTester tester) async {
              await tester.pumpWidget(const DosyaXApp());
              await tester.pump();
              expect(find.byType(MaterialApp), findsOneWidget);
            });
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dosyax-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
